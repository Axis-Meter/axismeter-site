name: Deploy to Cloudflare Workers

# The Workers deployment has no runtime ISR: the incremental cache is backed by
# Workers Static Assets and is read-only (see open-next.config.ts). Content
# therefore refreshes by redeploying rather than by revalidating, so this
# workflow is the publish path.
#
# Triggers:
#   workflow_dispatch     — manual redeploy
#   repository_dispatch   — sent by the Sanity webhook once wired at cutover
#                           (event type: content-published). See CUTOVER.md.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Until CLOUDFLARE_API_TOKEN exists the workflow is a no-op, so merging
      # this file changes nothing about the current Vercel deployment.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping build and deploy."
          fi

      - name: Build worker
        if: steps.creds.outputs.configured == 'true'
        run: npm run cf:build

      # preCommands runs populateCache so the prerendered pages land in
      # .open-next/assets before wrangler uploads the assets directory.
      # Without it the static-assets incremental cache has nothing to read.
      - name: Deploy worker
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dd90aa33b1bc9fba13338cccaa1bc6a5
          preCommands: npx opennextjs-cloudflare populateCache remote
          command: deploy
